name: Lint

on:
  push:
    branches: [master]
    paths:
      - "*.py"
      - "*.pyi"
  pull_request:
    branches: [master]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements_dev.txt

      - name: Run mypy
        uses: jpetrucciani/mypy-check@master
        with:
          requirements: numpy crackle-codec
          path: "cc3d"
